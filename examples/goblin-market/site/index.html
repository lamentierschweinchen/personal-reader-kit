    <aside class="engraving-note" id="the-bargain" data-after="line-140" aria-labelledby="bargain-title">
      <figure>
        <button type="button" class="plate-button" data-plate="frontispiece" aria-label="Enlarge the frontispiece"><img src="frontispiece.webp" width="2218" height="2651" loading="lazy" alt="Laura lifts a lock of hair among the goblins. Lizzie glances back from the upper left, pitcher in hand."><svg class="icon" aria-hidden="true" focusable="false"><use href="#expand"/></svg></button>
        <figcaption>Frontispiece · Dante Gabriel Rossetti</figcaption>
      </figure>
      <div class="engraving-commentary">
        <h3 id="bargain-title">A curl for the fruit</h3>
        <p>Dante Gabriel Rossetti designed this frontispiece for his sister’s first book, published in 1862. By the time Laura cuts her hair, Lizzie has already run away. The picture keeps her in the upper-left corner, looking back.</p>
        <p>Laura says her only gold is on the furze, a bush with yellow flowers. The goblins find gold in her hair. Dante Gabriel catches the moment before the first bite, with the price in Laura’s hand and the fruit within reach.</p>
      </div>
    </aside>
    <aside class="engraving-note" id="the-sisters" data-after="line-198" aria-labelledby="sisters-title">
      <figure>
        <button type="button" class="plate-button" data-plate="title" aria-label="Enlarge the illustrated title page"><img src="title-page.webp" width="2340" height="3151" loading="lazy" alt="The sisters hold each other in bed. Above them, goblins carry fruit through a round inset."><svg class="icon" aria-hidden="true" focusable="false"><use href="#expand"/></svg></button>
        <figcaption>Title page · Dante Gabriel Rossetti</figcaption>
      </figure>
      <div class="engraving-commentary">
        <h3 id="sisters-title">The market in the corner</h3>
        <p>On the original title page, the sisters lie like the two pigeons in the stanza, each tucked into the other’s arms. The goblins that crowded the first picture now file through a small circle above the bed.</p>
        <p>In the poem the wind sings and even the owls keep still. The engraving keeps the market going within sight of the bed.</p>
      </div>
    </aside>

    <h3>The engravings</h3>
    <p>Both designs are by Dante Gabriel Rossetti. William James Linton engraved the title page, signed WJL. The frontispiece bears the mark of Morris, Marshall, Faulkner &amp; Co. The Rossetti Archive and the Metropolitan Museum of Art attribute the work on the block to Charles Joseph Faulkner. The Archive records a competing attribution to Morris.</p>
    <p>The two images reproduce the same 1862 witness as the poem. Wikimedia Commons marks each reproduction as public domain. The cover uses a crop of the frontispiece.</p>
