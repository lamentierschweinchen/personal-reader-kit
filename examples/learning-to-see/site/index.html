<!doctype html>

  <link rel="icon" href="/icon.svg" type="image/svg+xml">

  <svg class="icon-definitions" aria-hidden="true" focusable="false"><defs><path id="ui-arrow" d="M3 8h10M8 3l5 5-5 5"/></defs></svg>
  <a class="skip-link" href="#main">Skip to reading</a>
  <header class="masthead">
    <a class="wordmark" href="#shelf" aria-label="Learning to See, your books">Learning to See<span class="wordmark-dot">.</span></a>

  <noscript><style>.masthead,#main,.loading,.site-footer,#selection-save{display:none!important}noscript h1{font-size:clamp(2rem,6vw,3rem)}</style><h1>Learning to See</h1><p>Enable JavaScript to read these illustrated books and keep passages in this browser. Reading, notes and offline controls are unavailable while JavaScript is disabled.</p><p class="catalogue-return"><a href="https://newreading.app/library/">Return to the public library</a></p></noscript>
