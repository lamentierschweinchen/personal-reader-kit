<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#201b2d">
  <meta name="description" content="Julian of Norwich, Rabindranath Tagore and William James. Three independent works, with optional editorial studies.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/share-card.css">
  <link rel="stylesheet" href="/collection.css">
  <title>The Inward Life</title>
</head>
<body>
  <svg class="icon-definitions" aria-hidden="true" focusable="false"><defs><path id="ui-arrow" d="M3 8h10M8 3l5 5-5 5"/></defs></svg>
  <a class="skip-link" href="#main">Skip to reading</a>
  <header class="masthead">
    <a class="wordmark" href="#shelf" aria-label="The Inward Life, your shelf">The Inward Life</a>
    <nav aria-label="Main navigation">
      <a href="#shelf/books" data-nav="shelf">Books</a>
      <a href="#companion/doors" data-nav="companion">Readings</a>
      <a href="#passages" data-nav="passages">Passages</a>
    </nav>
    <button class="type-button" data-action="settings" aria-label="Reading settings">Aa</button>
  </header>
  <div id="storage-warning" class="warning" role="alert" hidden></div>
  <p id="focus-help" class="visually-hidden">Focus mode: tap the reading surface or press C to recall controls. Escape exits. Selecting words still lets you keep passages.</p>
  <button id="focus-reveal" class="focus-reveal" data-action="focus-reveal" aria-controls="focus-tools" aria-expanded="false" hidden>Show reading controls</button>
  <div id="focus-tools" role="group" aria-label="Reading controls" hidden><button data-action="focus-hide">Hide controls</button><button id="focus-exit" data-action="focus" hidden>Exit focus <svg class="ui-icon ui-icon--up-right" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#ui-arrow"></use></svg></button></div>
  <main id="main" tabindex="-1"><p class="loading">Opening your shelf…</p></main>

  <button id="selection-save" hidden>Keep or share passage <span aria-hidden="true">＋</span></button>
  <footer class="site-footer"><span class="small">The Inward Life · <a href="/collection-art.svg">Original cover composition</a></span><button class="collection-about-link" data-action="collection-about">About this collection</button><button id="offline-status" data-action="offline">Checking offline copy…</button><button data-action="import">Add a book <svg class="ui-icon ui-icon--up-right" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#ui-arrow"></use></svg></button><p class="maker-credit">Made with <a href="https://newreading.app/">newreading.app</a></p></footer>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <noscript><style>.masthead,.loading,.site-footer,#focus-help,#focus-reveal,#focus-tools,#selection-save,#status{display:none!important}#main{min-height:0}.noscript-message{max-width:42rem;margin:0 auto;padding:40px 6vw}.noscript-message h1{font-size:2.5rem;line-height:1.15}</style><section class="noscript-message"><h1>The Inward Life</h1><p>JavaScript is needed to open these editions, save your place and keep notes in this reader. Enable it to read here, or return to the library.</p><p class="catalogue-return"><a href="https://newreading.app/library/">Return to the reader library</a></p></section></noscript>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
