name: Reader checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build
      - run: npm run audit:public
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/selection-touch-browser.mjs
        if: hashFiles('tests/selection-touch-browser.mjs') != ''
      - run: npm run test:browser
      - run: npm run test:cards
        env:
          SHARE_CARD_PROJECTS: ${{ hashFiles('examples/catalog.json') != '' && 'all' || '.' }}
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node showcase/check.mjs
        if: hashFiles('showcase/check.mjs') != ''
      - run: node showcase/check-shelf.mjs --skip-build
        if: hashFiles('showcase/check-shelf.mjs') != ''
      - run: node showcase/check-library.mjs --skip-build
        if: hashFiles('showcase/check-library.mjs') != ''
      - run: node showcase/check-handoff.mjs --skip-build
        if: hashFiles('showcase/check-handoff.mjs') != ''
      - run: node showcase/check-personal.mjs --skip-build
        if: hashFiles('showcase/check-personal.mjs') != ''
      - run: node showcase/check-readers.mjs --skip-build
        if: hashFiles('showcase/check-readers.mjs') != ''
      - run: node showcase/check-collection-recovery.mjs
        if: hashFiles('showcase/check-collection-recovery.mjs') != ''
      - run: node showcase/check-games.mjs --skip-build
        if: hashFiles('showcase/check-games.mjs') != ''
      - run: node showcase/check-game-updates.mjs --skip-build
        if: hashFiles('showcase/check-game-updates.mjs') != ''
      - run: node showcase/check-gameplay.mjs --skip-build
        if: hashFiles('showcase/check-gameplay.mjs') != ''
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check:examples
      - run: node showcase/check-inputs.mjs
        if: hashFiles('showcase/check-inputs.mjs') != ''
